# ========================================
# TDPokerPro Platform - Docker Compose Development
# ========================================
# Servicios de infraestructura para desarrollo local

version: "3.8"

services:
  # ========================================
  # PostgreSQL - Base de datos principal
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: tdpokerpro-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tdpokerpro_dev
      POSTGRES_USER: tdpokerpro_user
      POSTGRES_PASSWORD: tdpokerpro_dev_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/packages/database/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdpokerpro_user -d tdpokerpro_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tdpokerpro-network

  # ========================================
  # Redis - Cache y Real-time state
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: tdpokerpro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass tdpokerpro_redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - tdpokerpro-network

  # ========================================
  # Elasticsearch - Búsqueda y Analytics
  # ========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: tdpokerpro-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tdpokerpro-network

  # ========================================
  # pgAdmin - Gestión de PostgreSQL (Opcional)
  # ========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tdpokerpro-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tdpokerpro.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - tdpokerpro-network
    depends_on:
      - postgres

  # ========================================
  # RedisInsight - Gestión de Redis (Opcional)
  # ========================================
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: tdpokerpro-redis-insight
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - redis_insight_data:/db
    networks:
      - tdpokerpro-network
    depends_on:
      - redis

# ========================================
# Volúmenes persistentes
# ========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_insight_data:
    driver: local

# ========================================
# Red interna
# ========================================
networks:
  tdpokerpro-network:
    driver: bridge
    name: tdpokerpro-network
